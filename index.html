
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RATHA RACE - Ancient Bharat</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#170e09;color:#ffe2a2;font-family:Georgia,serif;overflow:hidden}
canvas{display:block;width:100vw;height:100dvh}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;gap:5px}
.stat{background:#211309dd;border:1px solid #bd914b;padding:8px;border-radius:9px;text-align:center;font:12px Arial}
.stat b{display:block;font-size:17px;color:#ffdb8c;margin-top:4px}
#menu{position:fixed;inset:0;background:#130b08eF;display:flex;align-items:center;justify-content:center;padding:18px}
.card{width:min(420px,100%);background:linear-gradient(145deg,#482a13,#160d08);border:2px solid #c99a4e;border-radius:18px;padding:23px;text-align:center}
h1{font-size:34px;letter-spacing:3px;color:#ffda8d;margin:5px}
p{color:#dfc59c;font:13px Arial;line-height:1.6}
select,button{width:100%;padding:13px;margin-top:10px;border-radius:9px;border:1px solid #c99a4e;background:#28180d;color:#ffe2a2;font-size:16px}
button{background:linear-gradient(#b77a2e,#754019);font-weight:bold;cursor:pointer}
#controls{position:fixed;bottom:18px;left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none}
.pad{display:flex;gap:12px;pointer-events:auto}
.control{width:68px;height:68px;border-radius:50%;background:#28180ddd;color:#ffe2a2;border:2px solid #d3a85e;font-size:27px;touch-action:none}
#pause{position:fixed;right:12px;top:80px;width:45px;padding:8px;pointer-events:auto}
#message{position:fixed;top:22%;width:100%;text-align:center;font: bold 15px Arial;color:#ffe6ae;text-shadow:0 2px 5px black;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="stat">DISTANCE<b id="dist">0 m</b></div>
 <div class="stat">SCORE<b id="score">0</b></div>
 <div class="stat">SPEED<b id="speed">0</b></div>
</div>
<button id="pause" onclick="togglePause()">Ⅱ</button>
<div id="message">DODGE OBSTACLES • COLLECT GOLD</div>
<div id="controls">
 <div class="pad">
  <button class="control" id="left">◀</button>
  <button class="control" id="right">▶</button>
 </div>
 <button class="control" id="brake">Ⅱ</button>
</div>
<div id="menu">
 <div class="card">
  <h1>RATHA RACE</h1>
  <p>🏛️ A RACE THROUGH ANCIENT BHARAT 🏛️</p>
  <p>Choose your kingdom and vehicle.</p>
  <select id="era">
   <option value="0">Mauryan Empire - Royal Palace</option>
   <option value="1">Gupta Age - Sacred Temples</option>
   <option value="2">Rajput Kingdom - Desert Forts</option>
   <option value="3">Chola Dynasty - Temple Coast</option>
  </select>
  <select id="vehicle">
   <option value="0">Royal Horse Chariot</option>
   <option value="1">Bullock Cart</option>
   <option value="2">Royal Elephant</option>
   <option value="3">Warrior Horse</option>
  </select>
  <button onclick="startGame()">START RACING</button>
  <p>PC: Arrow keys or A/D to steer.<br>Phone: Use the left and right buttons.<br>Collect gold. Avoid road obstacles!</p>
 </div>
</div>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let W,H,playing=false,paused=false,era=0,vehicle=0;
let lane=0,objects=[],distance=0,score=0,speed=220,spawn=0,last=0;
function resize(){
 W=canvas.width=innerWidth*devicePixelRatio;
 H=canvas.height=innerHeight*devicePixelRatio;
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
 W=innerWidth;H=innerHeight;
}
addEventListener("resize",resize);resize();
function roadPoint(y){
 let t=(y/H);
 let half= W*(.045+t*.43);
 return {l:W/2-half,r:W/2+half};
}
function polygon(points,color){
 ctx.fillStyle=color;ctx.beginPath();
 points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
 ctx.closePath();ctx.fill();
}
function drawTemple(x,y,s){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 ctx.fillStyle=era===2?"#9a5931":"#c49a62";
 ctx.fillRect(-34,-55,68,55);
 ctx.fillRect(-42,-61,84,9);
 for(let i=0;i<5;i++){
  polygon([[-28+i*3,-61-i*12],[28-i*3,-61-i*12],[0,-76-i*12]],"#a87942");
 }
 ctx.fillStyle="#372017";ctx.fillRect(-8,-35,16,35);
 ctx.restore();
}
function drawWorld(){
 let sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,era===2?"#b66a3d":"#6b8d9b");
 sky.addColorStop(.65,era===2?"#e3a05b":"#e9b879");
 sky.addColorStop(1,"#c28a4f");
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 ctx.fillStyle="#ffd88a";ctx.beginPath();ctx.arc(W*.78,H*.18,H*.055,0,7);ctx.fill();
 polygon([[0,H*.46],[W*.2,H*.34],[W*.4,H*.46],[W*.65,H*.32],[W,H*.45],[W,H],[0,H]],era===2?"#a36c3d":"#596c42");
 // moving scenery
 for(let side of [-1,1]){
  for(let i=0;i<5;i++){
   let y=((i*H*.28+(distance*.55)% (H*.3))%(H*.85))+H*.12;
   let s=.25+y/H*.75;
   let x=W/2+side*(W*.18+y*.38);
   if(era===1||era===3)drawTemple(x,y,s);
   else{
    ctx.fillStyle="#9a673d";ctx.fillRect(x-25*s,y-55*s,50*s,55*s);
    ctx.fillStyle="#d5a05a";ctx.fillRect(x-31*s,y-62*s,62*s,8*s);
    ctx.fillStyle="#382014";ctx.fillRect(x-7*s,y-29*s,14*s,29*s);
   }
  }
 }
 // ground and road
 ctx.fillStyle=era===2?"#b77a42":"#6e6c3d";ctx.fillRect(0,H*.48,W,H*.52);
 let top=H*.42,bottom=H*1.05;
 polygon([[W/2-W*.055,top],[W/2+W*.055,top],[W*1.04,bottom],[-W*.04,bottom]],"#49382b");
 for(let i=0;i<14;i++){
  let y=top+(i/14)*(bottom-top);
  let p=roadPoint(y);
  ctx.fillStyle=i%2?"#6d5038":"#49382b";
  ctx.fillRect(p.l,y,p.r-p.l,Math.max(2,H*.012));
 }
 for(let side of [-1,1]){
  for(let j=0;j<2;j++){
   ctx.strokeStyle="#e0bd7a";ctx.lineWidth=2;
   ctx.beginPath();ctx.moveTo(W/2+side*W*.055,H*.42);
   ctx.lineTo(W/2+side*W*.49,H*1.05);ctx.stroke();
  }
 }
 // lane markers
 for(let i=0;i<9;i++){
  let y=H*.46+((i*H*.11+distance*1.5)%(H*.58));
  let p=roadPoint(y),x=W/2;
  ctx.fillStyle="#e6c58b";ctx.fillRect(x-2,y,4,Math.max(3,y/H*12));
 }
}
function drawVehicle(){
 let x=W/2+lane*W*.22,y=H*.82,s=Math.min(W/390,1.35);
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 // wheels
 ctx.fillStyle="#20130d";
 for(let a of [-45,45]){
  ctx.beginPath();ctx.ellipse(a,5,10,24,-.2,0,7);ctx.fill();
  ctx.strokeStyle="#c38c43";ctx.lineWidth=3;ctx.stroke();
 }
 if(vehicle===2){
  ctx.fillStyle="#77766b";ctx.beginPath();ctx.ellipse(0,-28,42,44,0,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(0,-65,25,0,7);ctx.fill();
  ctx.fillStyle="#d7a747";ctx.fillRect(-32,-95,64,12);
  ctx.fillRect(-26,-118,52,23);
 }else{
  ctx.fillStyle=vehicle===1?"#d4c5a0":"#8b4d29";
  if(vehicle===3){ctx.beginPath();ctx.ellipse(0,-30,22,40,0,0,7);ctx.fill();ctx.fillRect(-13,-80,26,42);}
  else{
   ctx.fillRect(-43,-51,86,42);
   ctx.fillStyle="#d49a43";ctx.fillRect(-46,-55,92,8);
   ctx.fillStyle="#402516";ctx.fillRect(-35,-9,70,7);
   ctx.fillStyle="#9b6231";
   for(let a of [-20,20]){
    ctx.beginPath();ctx.ellipse(a,-82,13,25,-.2,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(a,-105,12,0,7);ctx.fill();
   }
  }
 }
 ctx.fillStyle="#f0c76b";ctx.fillRect(-5,-65,10,10);
 ctx.restore();
}
function drawObjects(){
 for(let o of objects){
  let t=1-o.z;
  let y=H*(.45+t*.48);
  let x=W/2+o.lane*(W*(.055+t*.38));
  let s=.25+t*1.2;
  if(o.type==="coin"){
   ctx.fillStyle="#ffdc55";ctx.beginPath();ctx.arc(x,y,11*s,0,7);ctx.fill();
   ctx.strokeStyle="#fff0a0";ctx.lineWidth=3*s;ctx.stroke();
  }else{
   ctx.fillStyle="#74401e";ctx.fillRect(x-17*s,y-25*s,34*s,25*s);
   ctx.fillStyle="#d6a34c";ctx.fillRect(x-20*s,y-29*s,40*s,6*s);
  }
 }
}
function addObjects(){
 let laneChoice=Math.floor(Math.random()*3)-1;
 objects.push({lane:laneChoice,z:0,type:Math.random()<.43?"coin":"block"});
}
function startGame(){
 era=+document.getElementById("era").value;
 vehicle=+document.getElementById("vehicle").value;
 lane=0;objects=[];distance=0;score=0;speed=220;spawn=0;
 playing=true;paused=false;last=0;
 document.getElementById("menu").style.display="none";
 document.getElementById("message").textContent="RACE ON! COLLECT GOLD!";
}
function finish(){
 playing=false;
 document.getElementById("menu").style.display="flex";
 document.querySelector("#menu h1").textContent="RACE FINISHED!";
 document.querySelector("#menu .card p").textContent="Distance: "+Math.floor(distance)+" m | Score: "+score;
}
function steer(n){if(playing&&!paused)lane=Math.max(-1,Math.min(1,lane+n))}
function togglePause(){if(playing){paused=!paused;document.getElementById("message").textContent=paused?"PAUSED":"RACE ON!"}}
addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")steer(-1);
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")steer(1);
 if(e.code==="Space")togglePause();
});
function bind(id,fn){
 let el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{e.preventDefault();fn()});
}
bind("left",()=>steer(-1));bind("right",()=>steer(1));bind("brake",togglePause);
function frame(time){
 let dt=Math.min((time-last)/1000||0,.04);last=time;
 drawWorld();
 if(playing&&!paused){
  distance+=speed*dt/8;spawn+=dt;
  if(spawn>.85){spawn=0;addObjects()}
  for(let o of objects){
   o.z+=dt*.34;
   if(o.z>.88&&o.z<1.02&&o.lane===lane){
    if(o.type==="coin"){score+=50;o.z=2}
    else{o.z=2;score=Math.max(0,score-20);document.getElementById("message").textContent="OBSTACLE HIT!"}
   }
  }
  objects=objects.filter(o=>o.z<1.15);
  if(distance>1500)finish();
  document.getElementById("dist").textContent=Math.floor(distance)+" m";
  document.getElementById("score").textContent=score;
  document.getElementById("speed").textContent=Math.floor(speed)+" km/h";
 }
 drawObjects();drawVehicle();
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
  </html>
